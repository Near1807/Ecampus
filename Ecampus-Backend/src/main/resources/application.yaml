spring:
  application:
    name: Ecampus-Backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

# Premier superadmin, créé au démarrage
# s'il n'en existe aucun.
ecampus:
  bootstrap:
    superadmin:
      mail: ${ECAMPUS_SUPERADMIN_MAIL:}
      password: ${ECAMPUS_SUPERADMIN_PASSWORD:}
      firstname: ${ECAMPUS_SUPERADMIN_FIRSTNAME:Super}
      lastname: ${ECAMPUS_SUPERADMIN_LASTNAME:Admin}
