name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Phase 2 (quand cd.yml existera) : remplacer "push" ci-dessus par :
  # workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regarde quels fichiers la PR (ou le push) modifie, pour ne lancer que les
  # jobs concernés. Un job sauté compte comme réussi pour la protection de main.
  changes:
    name: Détecter les changements
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # pour lister les fichiers modifiés d'une PR
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Lister les parties modifiées
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Modifier ci.yaml relance tout : on veut voir la nouvelle CI tourner.
          filters: |
            backend:
              - 'Ecampus-Backend/**'
              - 'supabase/migrations/**'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'Ecampus-Frontend/**'
              - '.github/workflows/ci.yaml'
            # Seulement ce qui définit les images. Le code lui-même est déjà
            # compilé et testé par les jobs backend et frontend.
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'Ecampus-Frontend/nginx.conf'
              - 'docker-compose.yaml'
              - '.github/workflows/ci.yaml'

  backend:
    name: Backend (tests Spring Boot)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecampus-Backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Créer les tables (migrations Supabase)
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          for f in ../supabase/migrations/*.sql; do
            echo "Migration : $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Compiler et lancer les tests
        run: ./mvnw -B verify

      - name: Garder les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rapports-tests-backend
          path: Ecampus-Backend/target/surefire-reports

  frontend:
    name: Frontend (lint + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecampus-Frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Ecampus-Frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (vérifie aussi les types TypeScript)
        run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    # Par défaut, un job est sauté dès qu'un job dont il dépend a été sauté.
    # !failure() && !cancelled() : on le lance tant que rien n'a échoué,
    # même si backend ou frontend ont été sautés.
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.docker == 'true' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Construire les images (sans les publier)
        run: docker compose build
