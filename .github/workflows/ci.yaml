name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Phase 2 (quand cd.yml existera) : remplacer "push" ci-dessus par :
  # workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecampus-Backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Créer les tables (migrations Supabase)
        env:
          PGHOST: localhost
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          for f in ../supabase/migrations/*.sql; do
            echo "Migration : $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Compiler et lancer les tests
        run: ./mvnw -B verify

      - name: Garder les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rapports-tests-backend
          path: Ecampus-Backend/target/surefire-reports

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecampus-Frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Ecampus-Frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (vérifie aussi les types TypeScript)
        run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Construire les images (sans les publier)
        run: docker compose build
