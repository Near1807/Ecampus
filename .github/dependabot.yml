version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/Ecampus-Backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/Ecampus-Frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/Ecampus-Backend"
      - "/Ecampus-Frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"