services:
  backend:
    build:
      context: ./Ecampus-Backend
    container_name: ecampus-backend
    ports:
      - "8080:8080"
    environment:
      # Base Postgres de Supabase local (lancée avec `npx supabase start`, port 54322)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:54322/postgres}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./Ecampus-Frontend
    container_name: ecampus-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
